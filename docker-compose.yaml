version: '1'

services:
  postgres:
    image: postgres:17
    container_name: libra-postgres
    environment:
      POSTGRES_DB: libra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # applied only when the data volume is first created
      - ./libra-core/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  redis:
    image: redis:latest
    container_name: libra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  libra:
    build: .
    image: libra:local
    container_name: libra-api
    environment:
      LIBRA_DB_URL: jdbc:postgresql://postgres:5432/libra
      LIBRA_DB_USERNAME: postgres
      LIBRA_DB_PASSWORD: postgres
      LIBRA_REDIS_HOST: redis
      LIBRA_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data: